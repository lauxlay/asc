name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: pnpm check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Exactement la commande locale : lint + typecheck + test + build.
      - run: pnpm check

  e2e:
    name: pnpm e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Cache des navigateurs Playwright
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm --filter @asc/web exec playwright install --with-deps chromium

      # La suite de régression e2e complète, cumulative : chaque lot y ajoute
      # ses parcours et l'ensemble tourne sur chaque PR.
      - run: pnpm e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-playwright
          path: apps/web/playwright-report/
          retention-days: 7

  docker:
    name: image docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      # L'artefact déployé est buildé à chaque PR : une image qui ne se
      # construit pas ne doit pas être découverte au moment du déploiement.
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          tags: asc:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Démarrage et sonde de santé
        run: |
          docker run -d --name asc-ci -p 3000:3000 \
            -e JWT_SECRET="secret-de-ci-suffisamment-long-pour-passer-zod" asc:ci
          for attempt in $(seq 1 30); do
            state=$(docker inspect -f '{{.State.Health.Status}}' asc-ci)
            [ "$state" = "healthy" ] && break
            [ "$state" = "unhealthy" ] && { docker logs asc-ci; exit 1; }
            sleep 2
          done
          [ "$(docker inspect -f '{{.State.Health.Status}}' asc-ci)" = "healthy" ] \
            || { docker logs asc-ci; exit 1; }

      - name: L'image sert l'API et le back-office
        run: |
          set -e
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/health)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/login)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/units)" = 401
